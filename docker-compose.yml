# CompGraph — FalkorDB (primary graph database)
# Usage: docker compose up -d && ./scripts/load.sh
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: compgraph-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

volumes:
  falkordb_data:
